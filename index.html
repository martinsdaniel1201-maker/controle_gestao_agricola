<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CTT UNIDADE PASSOS/MG</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icone_agro.png">
    <meta name="theme-color" content="#2e7d32">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --agro-green: #1B5E20; --agro-light: #43A047; --agro-gradient: linear-gradient(135deg, #1B5E20 0%, #43A047 100%); --bg-body: #F8F9FA; --bg-card: #FFFFFF; --text-main: #212529; --text-sub: #6C757D; --border: #DEE2E6; --danger: #C62828; --accent: #FF8F00; --blue: #1565C0; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-body); color: var(--text-main); padding-bottom: 20px; }
        .app-header { background: var(--agro-gradient); color: white; padding: 1.5rem 1rem; text-align: center; border-radius: 0 0 25px 25px; margin-bottom: 20px; }
        .container { max-width: 800px; margin: 0 auto; padding: 0 15px; }
        .tabs-nav { display: flex; gap: 8px; margin-bottom: 20px; padding: 6px; background: var(--bg-card); border-radius: 18px; border: 1px solid var(--border); overflow-x: auto; }
        .tab-btn { flex: 1; min-width: 80px; padding: 10px; border: none; border-radius: 14px; background: transparent; color: var(--text-sub); font-weight: 700; font-size: 11px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .tab-btn.active { background: var(--agro-green); color: white; }
        .section { display: none; } .section.active { display: block; }
        .card { background: #ffffff; border-radius: 20px; border: 1px solid var(--border); padding: 20px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        .card-title { font-size: 12px; font-weight: 800; color: var(--agro-green); margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        .grid-inputs { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
        .field label { font-size: 9px; font-weight: 700; color: var(--text-sub); text-transform: uppercase; margin-bottom: 4px; display: block; }
        .field input, .field select { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg-body); font-weight: 700; }
        .btn-add { background: transparent; border: 2px dashed var(--agro-green); color: var(--agro-green); padding: 12px; border-radius: 15px; font-weight: 700; cursor: pointer; width: 100%; margin-bottom: 20px; }
        .btn-main { background: var(--agro-gradient); color: white; border: none; padding: 15px; border-radius: 15px; font-weight: 800; cursor: pointer; width: 100%; }
        .frente-item { padding: 15px 0; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        #btn-pdf-flutuante { position: fixed; bottom: 30px; right: 30px; background-color: #2e7d32; color: white; border: none; padding: 15px 20px; border-radius: 50px; cursor: pointer; z-index: 9999; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .badge { padding: 4px 8px; border-radius: 6px; font-weight: bold; font-size: 11px; }
        @media screen and (max-width: 768px) { thead { display: none; } tr { display: block; background: #fff; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 8px; padding: 10px; } td { display: flex; justify-content: space-between; padding: 5px 0; } td::before { content: attr(data-label); font-weight: bold; } }
    </style>
</head>
<body>

<button id="btn-pdf-flutuante" onclick="gerarPDF()"><i class="fa fa-print"></i> PDF</button>

<header class="app-header">
    <div class="app-title">CTT UNIDADE PASSOS/MG</div>
</header>

<div class="container" id="app-root">
    <nav class="tabs-nav" id="main-nav">
        <button class="tab-btn active" onclick="showTab(event, 'entrada')"><i class="fas fa-edit"></i>COLHEDORAS</button>
        <button class="tab-btn" onclick="showTab(event, 'dash')"><i class="fas fa-chart-pie"></i>CONTROLE FRENTES</button>
        <button class="tab-btn" onclick="showTab(event, 'liberacoes')"><i class="fas fa-table"></i>LIBERAÇÕES</button>
        <button class="tab-btn" onclick="showTab(event, 'calc_aba')"><i class="fas fa-calculator"></i>CALCULADORA</button>
    </nav>

    <section id="entrada" class="section active">
        <div class="card">
            <div class="card-title">CONFIGURAÇÃO GERAL</div>
            <div class="grid-inputs">
                <div class="field"><label>Meta Unid. (t)</label><input type="number" id="meta_val" value="6500" oninput="update()"></div>
                <div class="field"><label>Diesel R$/L</label><input type="number" id="diesel_val" value="6.10" step="0.01" oninput="update()"></div>
            </div>
        </div>
        <div id="frentes-list"></div>
        <button class="btn-add" onclick="addFrente()">+ NOVA FRENTE DE TRABALHO</button>
        <button class="btn-main" onclick="update()">ATUALIZAR INDICADORES</button>
    </section>

    <section id="dash" class="section">
        <div class="card">
            <div class="grid-inputs">
                <div class="field"><label>Produção Total</label><div id="total_ton" style="font-size:20px; font-weight:800;">0</div></div>
                <div class="field"><label>Custo Diesel</label><div id="total_custo" style="font-size:20px; font-weight:800; color:var(--danger)">R$ 0</div></div>
            </div>
            <div class="progress-bar-bg" style="background:#eee; height:10px; border-radius:5px; margin-top:10px;"><div class="progress-bar-fill" id="meta_fill" style="background:var(--agro-green); height:100%; width:0%;"></div></div>
            <span id="meta_pct">0%</span>
        </div>
        <div class="card"><div id="lista-ranking"></div></div>
        <div class="card"><canvas id="prodChart"></canvas></div>
    </section>

    <section id="liberacoes" class="section">
        <div class="card">
            <input type="text" id="filtroFrente" placeholder="Filtrar frente..." oninput="filtrarTabela()" style="width:100%; padding:10px; margin-bottom:10px;">
            <table id="corpo-tabela-gatec" style="width:100%;"></table>
        </div>
    </section>

    <section id="calc_aba" class="section">
        <div class="card">
            <div class="card-title">ESTIMATIVA DE SAFRA</div>
            <div class="grid-inputs">
                <input type="number" id="safra_area" placeholder="Área (ha)" oninput="calcularSafra()">
                <input type="number" id="safra_tch" placeholder="TCH" oninput="calcularSafra()">
            </div>
            <div id="res_safra_container" style="margin-top:10px;">
                <p>Prod. Real: <b id="res_prod_liquida">0 t</b></p>
            </div>
        </div>
    </section>
</div>

<script>
    let frentes = [{ id: 1, nome: "FRENTE 01", maquinas: 5, tch: 85, vel: 4.5, larg: 1.5, efc: 85, horas: 12, diesel: 48 }];
    let myChart = null;

    function showTab(e, id) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(e && e.currentTarget) e.currentTarget.classList.add('active');
        if(id === 'dash') renderChart();
    }

    function addFrente() {
        frentes.push({ id: Date.now(), nome: `FRENTE 0${frentes.length + 1}`, maquinas: 1, tch: 80, vel: 4.0, larg: 1.5, efc: 85, horas: 12, diesel: 45 });
        renderFrentes(); update();
    }

    function update() {
        const prDiesel = parseFloat(document.getElementById('diesel_val').value) || 0;
        const metaG = parseFloat(document.getElementById('meta_val').value) || 1;
        let tTon = 0, tCusto = 0, rankingHtml = '';
        frentes.forEach(f => {
            const rend = (f.vel * f.larg * (f.efc/100)) / 10;
            const tonD = rend * f.tch * f.horas * f.maquinas;
            const cD = (f.diesel * prDiesel * f.horas * f.maquinas);
            tTon += tonD; tCusto += cD;
            rankingHtml += `<div class="frente-item"><b>${f.nome}</b> <b>${Math.round(tonD).toLocaleString()} t</b></div>`;
        });
        const pct = (tTon / metaG) * 100;
        document.getElementById('total_ton').innerText = Math.round(tTon).toLocaleString();
        document.getElementById('total_custo').innerText = 'R$ ' + Math.round(tCusto).toLocaleString();
        document.getElementById('meta_pct').innerText = pct.toFixed(1) + '%';
        document.getElementById('meta_fill').style.width = Math.min(pct, 100) + '%';
        document.getElementById('lista-ranking').innerHTML = rankingHtml;
    }

    function renderFrentes() {
        document.getElementById('frentes-list').innerHTML = frentes.map(f => `
            <div class="card">
                <input value="${f.nome}" oninput="editData(${f.id}, 'nome', this.value)" style="border:none; font-weight:800; color:var(--agro-green);">
                <div class="grid-inputs">
                    <input type="number" value="${f.maquinas}" placeholder="Máqs" oninput="editData(${f.id}, 'maquinas', this.value)">
                    <input type="number" value="${f.tch}" placeholder="TCH" oninput="editData(${f.id}, 'tch', this.value)">
                </div>
            </div>`).join('');
    }

    function editData(id, field, val) {
        const f = frentes.find(x => x.id === id);
        if(f) f[field] = field === 'nome' ? val : parseFloat(val) || 0;
        update();
    }

    function renderChart() {
        const ctx = document.getElementById('prodChart').getContext('2d');
        if(myChart) myChart.destroy();
        myChart = new Chart(ctx, { type: 'bar', data: { labels: frentes.map(f => f.nome), datasets: [{ label: 'Ton/Dia', data: frentes.map(f => (f.vel*f.larg*(f.efc/100)/10)*f.tch*f.horas*f.maquinas), backgroundColor: '#1B5E20' }] } });
    }

    function carregarDadosGATEC() {
        Papa.parse("https://docs.google.com/spreadsheets/d/e/2PACX-1vQTIIUGH-g6vlowVBAAkgoPwZd1EPJPJS8PzgOEWyDPito38Ii8qzOHaSh1PioGGMLNbwFJPDMzwsA7/pub?gid=0&single=true&output=csv", {
            download: true, header: true, complete: function(results) {
                document.getElementById('corpo-tabela-gatec').innerHTML = results.data.map(row => 
                    `<tr class="linha-tabela"><td data-label="Liberação:">${row["LIBERAÇÃO"]||""}</td><td data-label="Frente:">${row["FRENTE"]||""}</td><td>${row["DESC.FAZENDA"]||""}</td></tr>`).join('');
            }
        });
    }

    function gerarPDF() { html2pdf().from(document.body).save(); }
    
    renderFrentes(); update(); carregarDadosGATEC();
</script>
</body>
</html>
