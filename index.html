<!DOCTYPE html>
<html lang="pt-br">
<head>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icone_agro.png">
  <link rel="icon" type="image/png" href="icone_agro.png"> <meta name="theme-color" content="#1B5E20">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Controle Técnico Agrícola</title>
  
  <!-- External Stylesheet (Otimizado - substituindo CSS inline) -->
  <link rel="stylesheet" href="styles.css">
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- PDF Export Libraries (Carregarão sob demanda) -->
  <!-- html2canvas exposto globalmente -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <!-- jsPDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <!-- html2pdf -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <!-- PapaParse (CSV) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<!-- Offline Banner -->
<div id="offline-banner">
  <i class="fas fa-wifi" style="margin-right:6px; opacity:0.8;"></i>
  SEM CONEXÃO — Algumas funcionalidades podem estar indisponíveis
</div>

<!-- Toast Container -->
<div id="toast-container"></div>

<!-- Botão Dark Mode -->
<button id="btn-dark-mode" onclick="toggleDarkMode()" title="Alternar modo escuro">
  <i class="fas fa-moon" id="dark-mode-icon"></i>
</button>


<!-- Modal Salvar Cenário -->
<div class="modal-overlay" id="modal-cenario">
  <div class="modal-box">
    <div class="modal-title"><i class="fas fa-save" style="color:var(--green-700);margin-right:8px"></i>Salvar Simulação</div>
    <input class="modal-input" id="modal-cenario-nome" type="text" placeholder='Ex: "Cenário Seca - Maio/26"'>
    <div class="modal-btns">
      <button class="btn-secondary" onclick="fecharModal()">Cancelar</button>
      <button class="btn-main" style="margin:0" onclick="confirmarSalvar()">Salvar</button>
    </div>
  </div>
</div>

<header class="app-header">
  <div class="app-header-inner">
    <div class="app-badge">Gestão Operacional</div>
    <div class="app-title">CONTROLE TÉCNICO AGRÍCOLA</div>
    
    <div class="header-datetime" id="header-datetime">—</div>
  </div>
</header>
